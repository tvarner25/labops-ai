<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment | LabOps AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #274e13;
      --green-dark: #19360b;
      --green-light: #eaf1e6;
      --background: #f6f8f5;
      --white: #ffffff;
      --text: #172116;
      --muted: #6c766a;
      --border: #dfe5dc;
      --danger: #a83232;
      --danger-light: #fbeaea;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: var(--green-dark);
      color: white;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 42px;
    }

    .logo span {
      opacity: 0.7;
      font-weight: 400;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 13px 14px;
      border-radius: 9px;
      font-size: 15px;
    }

    .nav a:hover,
    .nav a.active {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 38px;
    }

    .back-link {
      display: inline-block;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 22px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .panel h2 {
      font-size: 17px;
      margin-bottom: 15px;
    }

    .content {
      color: #3f493d;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .empty-text {
      color: var(--muted);
      font-style: italic;
    }

    .detail {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail:first-of-type {
      padding-top: 0;
    }

    .detail:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-block;
      padding: 6px 9px;
      margin: 3px 4px 3px 0;
      border-radius: 6px;
      background: var(--green-light);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
    }

    button {
      font: inherit;
    }

    .edit-button,
    .save-button,
    .cancel-button,
    .add-note-button {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-button,
    .save-button,
    .add-note-button {
      background: var(--green);
      color: white;
    }

    .edit-button:hover,
    .save-button:hover,
    .add-note-button:hover {
      background: var(--green-dark);
    }

    .cancel-button {
      background: #eeeeee;
      color: var(--text);
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* EXPERIMENT LOG */

    .log-entry {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .log-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-type {
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
    }

    .log-date {
      font-size: 11px;
      color: var(--muted);
    }

    .log-text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .log-controls {
      display: flex;
      gap: 6px;
    }

    .log-edit-button,
    .log-delete-button {
      border: none;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .log-edit-button {
      background: var(--green-light);
      color: var(--green);
    }

    .log-edit-button:hover {
      background: #dce9d6;
    }

    .log-delete-button {
      background: var(--danger-light);
      color: var(--danger);
    }

    .log-delete-button:hover {
      background: #f4dada;
    }

    .note-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .note-form textarea,
    .log-edit-textarea {
      width: 100%;
      min-height: 100px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      resize: vertical;
      margin-bottom: 10px;
    }

    .note-actions,
    .log-edit-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .note-form select,
    .log-edit-select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    .log-save-button,
    .log-cancel-button {
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .log-save-button {
      background: var(--green);
      color: white;
    }

    .log-cancel-button {
      background: #eeeeee;
      color: var(--text);
    }

    .no-notes {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 850px) {
      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
        width: calc(100% - 200px);
        padding: 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .header,
      .log-header {
        flex-direction: column;
      }

      .note-actions,
      .log-edit-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .note-actions select,
      .note-actions button,
      .log-edit-actions select,
      .log-edit-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      LabOps <span>AI</span>
    </div>

    <nav class="nav">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/experiments.html" class="active">
        Experiments
      </a>
      <a href="#">Inventory</a>
      <a href="#">Tasks</a>
      <a href="#">AI Assistant</a>
    </nav>

    <div class="sidebar-bottom">
      LabOps AI<br>
      Research operations workspace
    </div>

  </aside>

  <main class="main">

    <a
      class="back-link"
      href="/experiments.html"
    >
      ← Back to Experiments
    </a>

    <div id="workspace">
      <div class="loading">
        Loading experiment...
      </div>
    </div>

  </main>

</div>


<script>
  let currentExperiment = null;
  let currentNotes = [];


  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function getExperimentId() {
    const params =
      new URLSearchParams(window.location.search);

    return params.get("id");
  }


  // ============================================================
  // LOAD EXPERIMENT
  // ============================================================

  async function loadExperiment() {
    const workspace =
      document.getElementById("workspace");

    const id = getExperimentId();

    if (!id || !/^\d+$/.test(id)) {
      workspace.innerHTML = `
        <div class="error">
          Invalid experiment ID.
        </div>
      `;

      return;
    }

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(id)
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to load experiment."
        );
      }

      currentExperiment = result.experiment;

      renderExperiment();

    } catch (error) {
      console.error(error);

      workspace.innerHTML = `
        <div class="error">
          <strong>
            Unable to load experiment.
          </strong>

          <br><br>

          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }


  // ============================================================
  // RENDER EXPERIMENT
  // ============================================================

  function renderExperiment() {
    const workspace =
      document.getElementById("workspace");

    const experiment = currentExperiment;

    const title = escapeHtml(
      experiment.title || "Untitled Experiment"
    );

    const project = escapeHtml(
      experiment.project || "Uncategorized"
    );

    const researcher = escapeHtml(
      experiment.researcher || "Not assigned"
    );

    const status = escapeHtml(
      experiment.status || "Planning"
    );

    const startDate = escapeHtml(
      experiment.start_date || "Not set"
    );

    const objective = experiment.objective
      ? escapeHtml(experiment.objective)
      : `
        <span class="empty-text">
          No objective added.
        </span>
      `;

    const protocol = experiment.protocol
      ? escapeHtml(experiment.protocol)
      : `
        <span class="empty-text">
          No protocol added.
        </span>
      `;

    const tags = String(experiment.tags || "")
      .split(",")
      .map(tag => tag.trim())
      .filter(Boolean);

    const tagsHtml = tags.length
      ? tags
          .map(
            tag =>
              `<span class="tag">${escapeHtml(tag)}</span>`
          )
          .join("")
      : `
        <span class="empty-text">
          No tags
        </span>
      `;

    document.title =
      title + " | LabOps AI";

    workspace.innerHTML = `
      <div class="header">

        <div>
          <h1>${title}</h1>
          <p>${project}</p>
        </div>

        <div>

          <span class="status">
            ${status}
          </span>

          <button
            class="edit-button"
            onclick="showEditForm()"
            style="margin-left: 10px;"
          >
            Edit Experiment
          </button>

        </div>

      </div>


      <div class="grid">

        <div>

          <section class="panel">

            <h2>Objective</h2>

            <div class="content">
              ${objective}
            </div>

          </section>


          <section class="panel">

            <h2>Protocol</h2>

            <div class="content">
              ${protocol}
            </div>

          </section>


          <section class="panel">

            <h2>Experiment Log</h2>

            <div id="experimentLog">

              <div class="no-notes">
                Loading entries...
              </div>

            </div>


            <div class="note-form">

              <textarea
                id="newNote"
                placeholder="Record an observation, result, procedure update, or other experiment note..."
              ></textarea>


              <div class="note-actions">

                <select id="entryType">

                  <option value="Observation">
                    Observation
                  </option>

                  <option value="Result">
                    Result
                  </option>

                  <option value="Procedure">
                    Procedure
                  </option>

                  <option value="Issue">
                    Issue
                  </option>

                  <option value="General">
                    General
                  </option>

                </select>


                <button
                  class="add-note-button"
                  onclick="addNote()"
                >
                  + Add Entry
                </button>

              </div>

            </div>

          </section>

        </div>


        <div>

          <section class="panel">

            <h2>
              Experiment Details
            </h2>


            <div class="detail">

              <div class="detail-label">
                Status
              </div>

              <div class="detail-value">
                ${status}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Researcher
              </div>

              <div class="detail-value">
                ${researcher}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Project
              </div>

              <div class="detail-value">
                ${project}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Start Date
              </div>

              <div class="detail-value">
                ${startDate}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Tags
              </div>

              <div class="detail-value">
                ${tagsHtml}
              </div>

            </div>

          </section>

        </div>

      </div>
    `;

    loadNotes();
  }


  // ============================================================
  // EDIT EXPERIMENT
  // ============================================================

  function showEditForm() {
    const workspace =
      document.getElementById("workspace");

    const experiment = currentExperiment;

    workspace.innerHTML = `
      <div class="header">

        <div>
          <h1>Edit Experiment</h1>
          <p>
            Update experiment information.
          </p>
        </div>

      </div>


      <section class="panel">

        <form id="editForm">

          <div class="form-group">

            <label>
              Experiment Title
            </label>

            <input
              id="title"
              type="text"
              value="${escapeHtml(
                experiment.title || ""
              )}"
              required
            >

          </div>


          <div class="form-group">

            <label>Project</label>

            <input
              id="project"
              type="text"
              value="${escapeHtml(
                experiment.project || ""
              )}"
            >

          </div>


          <div class="form-group">

            <label>Researcher</label>

            <input
              id="researcher"
              type="text"
              value="${escapeHtml(
                experiment.researcher || ""
              )}"
            >

          </div>


          <div class="form-group">

            <label>Status</label>

            <select id="status">

              <option value="Planning">
                Planning
              </option>

              <option value="In Progress">
                In Progress
              </option>

              <option value="Analysis">
                Analysis
              </option>

              <option value="Completed">
                Completed
              </option>

              <option value="On Hold">
                On Hold
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>Start Date</label>

            <input
              id="start_date"
              type="date"
              value="${escapeHtml(
                experiment.start_date || ""
              )}"
            >

          </div>


          <div class="form-group">

            <label>Objective</label>

            <textarea id="objective">${escapeHtml(
              experiment.objective || ""
            )}</textarea>

          </div>


          <div class="form-group">

            <label>Protocol</label>

            <textarea id="protocol">${escapeHtml(
              experiment.protocol || ""
            )}</textarea>

          </div>


          <div class="form-group">

            <label>Tags</label>

            <input
              id="tags"
              type="text"
              value="${escapeHtml(
                experiment.tags || ""
              )}"
              placeholder="hydrogel, cell culture, microscopy"
            >

          </div>


          <div class="edit-actions">

            <button
              type="submit"
              class="save-button"
            >
              Save Changes
            </button>


            <button
              type="button"
              class="cancel-button"
              onclick="renderExperiment()"
            >
              Cancel
            </button>

          </div>

        </form>

      </section>
    `;

    document.getElementById("status").value =
      experiment.status || "Planning";

    document
      .getElementById("editForm")
      .addEventListener(
        "submit",
        saveExperiment
      );
  }


  async function saveExperiment(event) {
    event.preventDefault();

    const id = getExperimentId();

    const data = {
      title:
        document.getElementById("title").value,

      project:
        document.getElementById("project").value,

      researcher:
        document.getElementById("researcher").value,

      status:
        document.getElementById("status").value,

      start_date:
        document.getElementById("start_date").value,

      objective:
        document.getElementById("objective").value,

      protocol:
        document.getElementById("protocol").value,

      tags:
        document.getElementById("tags").value
    };

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(id),
        {
          method: "PUT",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to save experiment."
        );
      }

      await loadExperiment();

    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }


  // ============================================================
  // LOAD NOTES
  // ============================================================

  async function loadNotes() {
    const id = getExperimentId();

    const container =
      document.getElementById("experimentLog");

    if (!container) {
      return;
    }

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(id) +
        "/notes"
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to load experiment log."
        );
      }

      currentNotes = result.notes || [];

      renderNotes();

    } catch (error) {
      console.error(error);

      container.innerHTML = `
        <div class="no-notes">
          Unable to load experiment log.
        </div>
      `;
    }
  }


  // ============================================================
  // RENDER NOTES
  // ============================================================

  function renderNotes() {
    const container =
      document.getElementById("experimentLog");

    if (!container) {
      return;
    }

    if (currentNotes.length === 0) {
      container.innerHTML = `
        <div class="no-notes">
          No experiment entries yet.
        </div>
      `;

      return;
    }

    container.innerHTML = currentNotes
      .map(note => {

        const type = escapeHtml(
          note.entry_type || "Observation"
        );

        const noteText = escapeHtml(
          note.note || ""
        );

        let date = "";

        if (note.created_at) {
          const parsedDate = new Date(
            note.created_at.replace(" ", "T") + "Z"
          );

          date = parsedDate.toLocaleString();
        }

        return `
          <div
            class="log-entry"
            id="note-${note.id}"
          >

            <div class="log-header">

              <div class="log-meta">

                <span class="log-type">
                  ${type}
                </span>

                <span class="log-date">
                  ${escapeHtml(date)}
                </span>

              </div>


              <div class="log-controls">

                <button
                  class="log-edit-button"
                  onclick="editNote(${note.id})"
                >
                  Edit
                </button>

                <button
                  class="log-delete-button"
                  onclick="deleteNote(${note.id})"
                >
                  Delete
                </button>

              </div>

            </div>


            <div class="log-text">
              ${noteText}
            </div>

          </div>
        `;
      })
      .join("");
  }


  // ============================================================
  // ADD NOTE
  // ============================================================

  async function addNote() {
    const id = getExperimentId();

    const textarea =
      document.getElementById("newNote");

    const typeSelect =
      document.getElementById("entryType");

    const note = textarea.value.trim();

    if (!note) {
      alert("Enter a note first.");
      return;
    }

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(id) +
        "/notes",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            note: note,
            entry_type: typeSelect.value
          })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to add entry."
        );
      }

      textarea.value = "";

      await loadNotes();

    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }


  // ============================================================
  // SHOW NOTE EDITOR
  // ============================================================

  function editNote(noteId) {
    const note = currentNotes.find(
      item => Number(item.id) === Number(noteId)
    );

    if (!note) {
      return;
    }

    const container =
      document.getElementById(
        "note-" + noteId
      );

    if (!container) {
      return;
    }

    container.innerHTML = `
      <textarea
        class="log-edit-textarea"
        id="edit-note-${noteId}"
      >${escapeHtml(note.note || "")}</textarea>


      <div class="log-edit-actions">

        <select
          class="log-edit-select"
          id="edit-type-${noteId}"
        >

          <option value="Observation">
            Observation
          </option>

          <option value="Result">
            Result
          </option>

          <option value="Procedure">
            Procedure
          </option>

          <option value="Issue">
            Issue
          </option>

          <option value="General">
            General
          </option>

        </select>


        <button
          class="log-save-button"
          onclick="saveNote(${noteId})"
        >
          Save
        </button>


        <button
          class="log-cancel-button"
          onclick="renderNotes()"
        >
          Cancel
        </button>

      </div>
    `;

    document.getElementById(
      "edit-type-" + noteId
    ).value =
      note.entry_type || "Observation";
  }


  // ============================================================
  // SAVE EDITED NOTE
  // ============================================================

  async function saveNote(noteId) {
    const experimentId =
      getExperimentId();

    const textarea =
      document.getElementById(
        "edit-note-" + noteId
      );

    const typeSelect =
      document.getElementById(
        "edit-type-" + noteId
      );

    const note = textarea.value.trim();

    if (!note) {
      alert("Entry cannot be empty.");
      return;
    }

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(experimentId) +
        "/notes/" +
        encodeURIComponent(noteId),
        {
          method: "PUT",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            note: note,
            entry_type: typeSelect.value
          })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to update entry."
        );
      }

      await loadNotes();

    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }


  // ============================================================
  // DELETE NOTE
  // ============================================================

  async function deleteNote(noteId) {
    const confirmed = confirm(
      "Delete this experiment log entry? This cannot be undone."
    );

    if (!confirmed) {
      return;
    }

    const experimentId =
      getExperimentId();

    try {
      const response = await fetch(
        "/api/experiments/" +
        encodeURIComponent(experimentId) +
        "/notes/" +
        encodeURIComponent(noteId),
        {
          method: "DELETE"
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error ||
          "Unable to delete entry."
        );
      }

      await loadNotes();

    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }


  // ============================================================
  // START
  // ============================================================

  loadExperiment();
</script>

</body>
</html>
