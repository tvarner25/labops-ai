<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment | LabOps AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #274e13;
      --green-dark: #19360b;
      --green-light: #eaf1e6;
      --background: #f6f8f5;
      --white: #ffffff;
      --text: #172116;
      --muted: #6c766a;
      --border: #dfe5dc;
      --danger: #a83232;
      --danger-light: #fbeaea;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: var(--green-dark);
      color: white;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 42px;
    }

    .logo span {
      opacity: 0.7;
      font-weight: 400;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 13px 14px;
      border-radius: 9px;
      font-size: 15px;
    }

    .nav a:hover,
    .nav a.active {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 38px;
    }

    .back-link {
      display: inline-block;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 22px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .panel h2 {
      font-size: 17px;
      margin-bottom: 15px;
    }

    .panel-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .content {
      color: #3f493d;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .empty-text {
      color: var(--muted);
      font-style: italic;
    }

    .detail {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail:first-of-type {
      padding-top: 0;
    }

    .detail:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-block;
      padding: 6px 9px;
      margin: 3px 4px 3px 0;
      border-radius: 6px;
      background: var(--green-light);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
    }

    button {
      font: inherit;
    }

    .primary-button,
    .edit-button,
    .save-button,
    .add-note-button {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: var(--green);
      color: white;
    }

    .primary-button:hover,
    .edit-button:hover,
    .save-button:hover,
    .add-note-button:hover {
      background: var(--green-dark);
    }

    .cancel-button {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: #eeeeee;
      color: var(--text);
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* RESULTS */

    .results-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    .results-table th {
      text-align: left;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    .results-table td {
      padding: 13px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: top;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .result-value {
      font-weight: 700;
    }

    .result-notes {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .row-actions {
      display: flex;
      gap: 5px;
    }

    .small-edit,
    .small-delete {
      border: none;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .small-edit {
      background: var(--green-light);
      color: var(--green);
    }

    .small-delete {
      background: var(--danger-light);
      color: var(--danger);
    }

    .result-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .result-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 0.7fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-form input,
    .result-form textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }

    .result-form textarea {
      min-height: 75px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .result-editor {
      padding: 16px;
      background: #fafbf9;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    /* VISUALIZATION */

    .visualization-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .visualization-controls label {
      font-size: 12px;
      font-weight: 700;
    }

    .visualization-controls select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font: inherit;
      min-width: 220px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .chart-unit {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .chart {
      display: flex;
      align-items: stretch;
      min-height: 300px;
    }

    .y-axis {
      width: 60px;
      min-width: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      padding-right: 10px;
      padding-bottom: 40px;
      font-size: 11px;
      color: var(--muted);
    }

    .chart-main {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .chart-area {
      height: 260px;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      padding: 0 16px;
    }

    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dashed #e4e8e1;
      pointer-events: none;
    }

    .bar-group {
      flex: 1;
      min-width: 55px;
      max-width: 120px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .bar-value {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .bar {
      width: 70%;
      min-width: 28px;
      max-width: 65px;
      background: var(--green);
      border-radius: 6px 6px 0 0;
      transition: height 0.25s ease;
      min-height: 2px;
    }

    .x-labels {
      display: flex;
      gap: 14px;
      padding: 8px 16px 0;
    }

    .x-label {
      flex: 1;
      min-width: 55px;
      max-width: 120px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .chart-scroll {
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .chart-scroll-inner {
      min-width: 500px;
    }

    /* LOG */

    .log-entry {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .log-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-type {
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
    }

    .log-date {
      font-size: 11px;
      color: var(--muted);
    }

    .log-text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .log-controls {
      display: flex;
      gap: 6px;
    }

    .log-edit-button,
    .log-delete-button,
    .log-save-button,
    .log-cancel-button {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .log-edit-button,
    .log-save-button {
      background: var(--green-light);
      color: var(--green);
    }

    .log-delete-button {
      background: var(--danger-light);
      color: var(--danger);
    }

    .log-cancel-button {
      background: #eeeeee;
      color: var(--text);
    }

    .note-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .note-form textarea,
    .log-edit-textarea {
      width: 100%;
      min-height: 100px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      resize: vertical;
      margin-bottom: 10px;
    }

    .note-actions,
    .log-edit-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .note-form select,
    .log-edit-select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    .no-data {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 850px) {
      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
        width: calc(100% - 200px);
        padding: 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .result-form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .header,
      .log-header {
        flex-direction: column;
      }

      .result-form-grid {
        grid-template-columns: 1fr;
      }

      .note-actions,
      .log-edit-actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      LabOps <span>AI</span>
    </div>

    <nav class="nav">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/experiments.html" class="active">Experiments</a>
      <a href="#">Inventory</a>
      <a href="#">Tasks</a>
      <a href="#">AI Assistant</a>
    </nav>

    <div class="sidebar-bottom">
      LabOps AI<br>
      Research operations workspace
    </div>

  </aside>

  <main class="main">

    <a class="back-link" href="/experiments.html">
      ← Back to Experiments
    </a>

    <div id="workspace">
      <div class="loading">
        Loading experiment...
      </div>
    </div>

  </main>

</div>

<script>
  let currentExperiment = null;
  let currentNotes = [];
  let currentResults = [];


  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function getExperimentId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }


  function formatDate(value) {
    if (!value) return "";

    const parsed = new Date(
      value.replace(" ", "T") + "Z"
    );

    return parsed.toLocaleString();
  }


  // ============================================================
  // EXPERIMENT
  // ============================================================

  async function loadExperiment() {
    const workspace = document.getElementById("workspace");
    const id = getExperimentId();

    if (!id || !/^\d+$/.test(id)) {
      workspace.innerHTML = `
        <div class="error">
          Invalid experiment ID.
        </div>
      `;
      return;
    }

    try {
      const response = await fetch(
        "/api/experiments/" + encodeURIComponent(id)
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error || "Unable to load experiment."
        );
      }

      currentExperiment = result.experiment;
      renderExperiment();

    } catch (error) {
      console.error(error);

      workspace.innerHTML = `
        <div class="error">
          <strong>Unable to load experiment.</strong>
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }


  function renderExperiment() {
    const workspace = document.getElementById("workspace");
    const experiment = currentExperiment;

    const title = escapeHtml(
      experiment.title || "Untitled Experiment"
    );

    const project = escapeHtml(
      experiment.project || "Uncategorized"
    );

    const researcher = escapeHtml(
      experiment.researcher || "Not assigned"
    );

    const status = escapeHtml(
      experiment.status || "Planning"
    );

    const startDate = escapeHtml(
      experiment.start_date || "Not set"
    );

    const objective = experiment.objective
      ? escapeHtml(experiment.objective)
      : '<span class="empty-text">No objective added.</span>';

    const protocol = experiment.protocol
      ? escapeHtml(experiment.protocol)
      : '<span class="empty-text">No protocol added.</span>';

    const tags = String(experiment.tags || "")
      .split(",")
      .map(tag => tag.trim())
      .filter(Boolean);

    const tagsHtml = tags.length
      ? tags.map(
          tag => `<span class="tag">${escapeHtml(tag)}</span>`
        ).join("")
      : '<span class="empty-text">No tags</span>';

    document.title = title + " | LabOps AI";

    workspace.innerHTML = `
      <div class="header">

        <div>
          <h1>${title}</h1>
          <p>${project}</p>
        </div>

        <div>
          <span class="status">${status}</span>

          <button
            class="edit-button"
            onclick="showEditForm()"
            style="margin-left: 10px;"
          >
            Edit Experiment
          </button>
        </div>

      </div>

      <div class="grid">

        <div>

          <section class="panel">
            <h2>Objective</h2>
            <div class="content">${objective}</div>
          </section>

          <section class="panel">
            <h2>Protocol</h2>
            <div class="content">${protocol}</div>
          </section>

          <section class="panel">

            <h2>Results & Data</h2>

            <div class="panel-subtitle">
              Structured measurements and experimental outputs.
            </div>

            <div id="resultsContainer">
              <div class="no-data">
                Loading results...
              </div>
            </div>

            <div class="result-form">

              <div class="result-form-grid">

                <input
                  id="resultSample"
                  type="text"
                  placeholder="Sample name"
                >

                <input
                  id="resultMeasurement"
                  type="text"
                  placeholder="Measurement"
                >

                <input
                  id="resultValue"
                  type="number"
                  step="any"
                  placeholder="Value"
                >

                <input
                  id="resultUnit"
                  type="text"
                  placeholder="Unit"
                >

              </div>

              <textarea
                id="resultNotes"
                placeholder="Optional notes about this result..."
              ></textarea>

              <button
                class="primary-button"
                onclick="addResult()"
              >
                + Add Result
              </button>

            </div>

          </section>


          <section class="panel">

            <h2>Data Visualization</h2>

            <div class="panel-subtitle">
              Automatically generated from your structured results.
            </div>

            <div id="visualizationContainer">

              <div class="no-data">
                Add results to generate a visualization.
              </div>

            </div>

          </section>


          <section class="panel">

            <h2>Experiment Log</h2>

            <div id="experimentLog">
              <div class="no-data">
                Loading entries...
              </div>
            </div>

            <div class="note-form">

              <textarea
                id="newNote"
                placeholder="Record an observation, result, procedure update, or other experiment note..."
              ></textarea>

              <div class="note-actions">

                <select id="entryType">
                  <option value="Observation">Observation</option>
                  <option value="Result">Result</option>
                  <option value="Procedure">Procedure</option>
                  <option value="Issue">Issue</option>
                  <option value="General">General</option>
                </select>

                <button
                  class="add-note-button"
                  onclick="addNote()"
                >
                  + Add Entry
                </button>

              </div>

            </div>

          </section>

        </div>


        <div>

          <section class="panel">

            <h2>Experiment Details</h2>

            <div class="detail">
              <div class="detail-label">Status</div>
              <div class="detail-value">${status}</div>
            </div>

            <div class="detail">
              <div class="detail-label">Researcher</div>
              <div class="detail-value">${researcher}</div>
            </div>

            <div class="detail">
              <div class="detail-label">Project</div>
              <div class="detail-value">${project}</div>
            </div>

            <div class="detail">
              <div class="detail-label">Start Date</div>
              <div class="detail-value">${startDate}</div>
            </div>

            <div class="detail">
              <div class="detail-label">Tags</div>
              <div class="detail-value">${tagsHtml}</div>
            </div>

          </section>

        </div>

      </div>
    `;

    loadResults();
    loadNotes();
  }


  // ============================================================
  // EDIT EXPERIMENT
  // ============================================================

  function showEditForm() {
    const workspace = document.getElementById("workspace");
    const experiment = currentExperiment;

    workspace.innerHTML = `
      <div class="header">
        <div>
          <h1>Edit Experiment</h1>
          <p>Update experiment information.</p>
        </div>
      </div>

      <section class="panel">

        <form id="editForm">

          <div class="form-group">
            <label>Experiment Title</label>
            <input
              id="title"
              type="text"
              value="${escapeHtml(experiment.title || "")}"
              required
            >
          </div>

          <div class="form-group">
            <label>Project</label>
            <input
              id="project"
              type="text"
              value="${escapeHtml(experiment.project || "")}"
            >
          </div>

          <div class="form-group">
            <label>Researcher</label>
            <input
              id="researcher"
              type="text"
              value="${escapeHtml(experiment.researcher || "")}"
            >
          </div>

          <div class="form-group">
            <label>Status</label>

            <select id="status">
              <option value="Planning">Planning</option>
              <option value="In Progress">In Progress</option>
              <option value="Analysis">Analysis</option>
              <option value="Completed">Completed</option>
              <option value="On Hold">On Hold</option>
            </select>
          </div>

          <div class="form-group">
            <label>Start Date</label>
            <input
              id="start_date"
              type="date"
              value="${escapeHtml(experiment.start_date || "")}"
            >
          </div>

          <div class="form-group">
            <label>Objective</label>
            <textarea id="objective">${escapeHtml(
              experiment.objective || ""
            )}</textarea>
          </div>

          <div class="form-group">
            <label>Protocol</label>
            <textarea id="protocol">${escapeHtml(
              experiment.protocol || ""
            )}</textarea>
          </div>

          <div class="form-group">
            <label>Tags</label>
            <input
              id="tags"
              type="text"
              value="${escapeHtml(experiment.tags || "")}"
            >
          </div>

          <div class="edit-actions">

            <button
              type="submit"
              class="save-button"
            >
              Save Changes
            </button>

            <button
              type="button"
              class="cancel-button"
              onclick="renderExperiment()"

      project: document.getElementById("project").value,

      status: document.getElementById("status").value,
      start_date: document.getElementById("start_date").value,
      objective: document.getElementById("objective").value,
      protocol: document.getElementById("protocol").value,
      tags: document.getElementById("tags").value

    try {
      const response = await fetch(
        "/api/experiments/" + encodeURIComponent(id),
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error || "Unable to save experiment."
        );

      await loadExperiment();

    } catch (error) {
      console.error(error);

  // ============================================================
  // DATA VISUALIZATION
  // ============================================================

  function getMeasurementGroups() {
    const groups = {};

    currentResults.forEach(result => {
      const measurement =
        String(result.measurement || "").trim();

      const unit =
        String(result.unit || "").trim();

      if (!measurement) return;

      const key =
        measurement.toLowerCase() +
        "||" +
        unit.toLowerCase();

      if (!groups[key]) {
        groups[key] = {
          key,
          measurement,
          unit,
          results: []
        };
      }

      groups[key].results.push(result);
    });

    return Object.values(groups);
  }


  function renderVisualization(selectedKey = null) {
    const container =
      document.getElementById(
        "visualizationContainer"
      );

    if (!container) return;

    const groups = getMeasurementGroups();

    if (groups.length === 0) {
      container.innerHTML = `
        <div class="no-data">
          Add structured results to generate a visualization.
        </div>
      `;
      return;
    }

    let selectedGroup =
      groups.find(group => group.key === selectedKey);

    if (!selectedGroup) {
      selectedGroup = groups[0];
    }

    const options = groups
      .map(group => {
        const label = group.unit
          ? `${group.measurement} (${group.unit})`
          : group.measurement;

        return `
          <option
            value="${escapeHtml(group.key)}"
            ${
              group.key === selectedGroup.key
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(label)}
          </option>
        `;
      })
      .join("");

    container.innerHTML = `
      <div class="visualization-controls">

        <label for="measurementSelector">
          Measurement
        </label>

        <select
          id="measurementSelector"
          onchange="changeVisualization()"
        >
          ${options}
        </select>

      </div>

      <div id="chartContainer"></div>
    `;

    drawBarChart(selectedGroup);
  }


  function changeVisualization() {
    const selector =
      document.getElementById(
        "measurementSelector"
      );

    if (!selector) return;

    renderVisualization(selector.value);
  }


  function drawBarChart(group) {
    const container =
      document.getElementById("chartContainer");

    if (!container) return;

    const validResults = group.results
      .filter(result =>
        Number.isFinite(Number(result.value))
      );

    if (validResults.length === 0) {
      container.innerHTML = `
        <div class="no-data">
          No numeric values are available for this measurement.
        </div>
      `;
      return;
    }

    const values =
      validResults.map(
        result => Number(result.value)
      );

    const maxValue = Math.max(...values);
    const minValue = Math.min(...values, 0);

    let chartMax = maxValue;

    if (chartMax <= 0) {
      chartMax = 1;
    }

    chartMax = chartMax * 1.15;

    const tickCount = 5;

    const ticks = [];

    for (let i = tickCount; i >= 0; i--) {
      const value =
        (chartMax / tickCount) * i;

      ticks.push(formatChartNumber(value));
    }

    const bars = validResults
      .map((result, index) => {

        const value = Number(result.value);

        const safeValue =
          Math.max(0, value);

        const height =
          chartMax === 0
            ? 0
            : (safeValue / chartMax) * 100;

        const sampleName =
          result.sample_name ||
          `Result ${index + 1}`;

        return `
          <div class="bar-group">

            <div class="bar-value">
              ${escapeHtml(
                formatChartNumber(value)
              )}
            </div>

            <div
              class="bar"
              style="height: ${height}%"
              title="${escapeHtml(
                sampleName +
                ": " +
                value +
                (group.unit
                  ? " " + group.unit
                  : "")
              )}"
            ></div>

          </div>
        `;
      })
      .join("");

    const labels = validResults
      .map((result, index) => {

        const sampleName =
          result.sample_name ||
          `Result ${index + 1}`;

        return `
          <div class="x-label">
            ${escapeHtml(sampleName)}
          </div>
        `;
      })
      .join("");

    const gridLines = `
      <div class="grid-line" style="top: 0%;"></div>
      <div class="grid-line" style="top: 20%;"></div>
      <div class="grid-line" style="top: 40%;"></div>
      <div class="grid-line" style="top: 60%;"></div>
      <div class="grid-line" style="top: 80%;"></div>
    `;

    container.innerHTML = `
      <div class="chart-title">
        ${escapeHtml(group.measurement)}
      </div>

      <div class="chart-unit">
        ${
          group.unit
            ? "Unit: " + escapeHtml(group.unit)
            : "No unit specified"
        }
      </div>

      <div class="chart-scroll">

        <div
          class="chart-scroll-inner"
          style="min-width: ${Math.max(
            500,
            validResults.length * 95
          )}px;"
        >

          <div class="chart">

            <div class="y-axis">
              ${ticks
                .map(
                  tick =>
                    `<span>${escapeHtml(tick)}</span>`
                )
                .join("")}
            </div>

            <div class="chart-main">

              <div class="chart-area">

                ${gridLines}
                ${bars}

              </div>

              <div class="x-labels">
                ${labels}
              </div>

            </div>

          </div>

        </div>

      </div>
    `;
  }


  function formatChartNumber(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) {
      return "";
    }

    if (
      Math.abs(number) >= 1000 ||
      (
        Math.abs(number) > 0 &&
        Math.abs(number) < 0.01
      )
    ) {
      return number.toExponential(2);
    }

    return Number(
      number.toFixed(3)
    ).toString();
  }
