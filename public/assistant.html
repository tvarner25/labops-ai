<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>LabOps AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      margin-top: 5px;
      color: #6b7280;
      font-size: 14px;
    }

    .main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      flex: 1;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .description {
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .examples {
      margin-bottom: 20px;
    }

    .examples-title {
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .example-button {
      border: 1px solid #d1d5db;
      background: #ffffff;
      border-radius: 20px;
      padding: 8px 12px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
      font-size: 13px;
    }

    .example-button:hover {
      background: #f3f4f6;
    }

    .chat {
      min-height: 250px;
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      background: #fafafa;
      margin-bottom: 16px;
    }

    .message {
      margin-bottom: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message-user {
      background: #e5e7eb;
      padding: 10px 12px;
      border-radius: 10px;
      margin-left: 35px;
    }

    .message-ai {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      border-radius: 10px;
      margin-right: 35px;
    }

    .message-label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #6b7280;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 70px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #6b7280;
    }

    .ask-button {
      min-width: 110px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .ask-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .input-row {
        flex-direction: column;
      }

      .ask-button {
        width: 100%;
      }

      .message-user {
        margin-left: 15px;
      }

      .message-ai {
        margin-right: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-inner">
        <div class="brand">LabOps AI</div>
        <div class="subtitle">
          Research Operations Assistant
        </div>
      </div>
    </header>

    <main class="main">

      <a
        class="back-link"
        href="/dashboard.html"
      >
        ← Back to Dashboard
      </a>

      <div class="card">

        <h1>AI Assistant</h1>

        <div class="description">
          Ask questions about your experiments,
          tasks, inventory, experiment logs,
          and structured results.
        </div>

        <div class="examples">
          <div class="examples-title">
            Try asking
          </div>

          <button
            class="example-button"
            onclick="useExample(
              'What needs my attention right now?'
            )"
          >
            What needs my attention?
          </button>

          <button
            class="example-button"
            onclick="useExample(
              'Which inventory items are low or expiring soon?'
            )"
          >
            Check inventory
          </button>

          <button
            class="example-button"
            onclick="useExample(
              'What experiments are currently active?'
            )"
          >
            Active experiments
          </button>

          <button
            class="example-button"
            onclick="useExample(
              'Summarize my latest experiment results.'
            )"
          >
            Latest results
          </button>
        </div>

        <div
          class="chat"
          id="chat"
        >
          <div class="message message-ai">
            <div class="message-label">
              LabOps AI
            </div>

            Ask me a question about your lab.
          </div>
        </div>

        <div class="input-row">

          <textarea
            id="question"
            placeholder="Ask LabOps AI..."
          ></textarea>

          <button
            class="ask-button"
            id="askButton"
            onclick="askAssistant()"
          >
            Ask AI
          </button>

        </div>

        <div
          class="status"
          id="status"
        ></div>

      </div>
    </main>
  </div>


  <script>
    const questionInput =
      document.getElementById("question");

    const chat =
      document.getElementById("chat");

    const askButton =
      document.getElementById("askButton");

    const statusElement =
      document.getElementById("status");


    function useExample(question) {
      questionInput.value = question;
      questionInput.focus();
    }


    function addMessage(
      label,
      text,
      type
    ) {
      const message =
        document.createElement("div");

      message.className =
        "message " +
        (
          type === "user"
            ? "message-user"
            : "message-ai"
        );


      const labelElement =
        document.createElement("div");

      labelElement.className =
        "message-label";

      labelElement.textContent =
        label;


      const textElement =
        document.createElement("div");

      textElement.textContent =
        text;


      message.appendChild(
        labelElement
      );

      message.appendChild(
        textElement
      );

      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;
    }


    async function askAssistant() {

      const question =
        questionInput.value.trim();


      if (!question) {
        statusElement.textContent =
          "Enter a question first.";

        return;
      }


      addMessage(
        "You",
        question,
        "user"
      );


      questionInput.value = "";

      askButton.disabled = true;

      statusElement.textContent =
        "LabOps AI is thinking...";


      try {

        const response =
          await fetch(
            "/api/assistant",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                question
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {
          throw new Error(
            data.error ||
            "Unable to get an AI response."
          );
        }


        addMessage(
          "LabOps AI",
          data.answer,
          "ai"
        );


        statusElement.textContent = "";


      } catch (error) {

        console.error(error);

        addMessage(
          "LabOps AI",
          "I couldn't answer that question. " +
          "Please try again.",
          "ai"
        );

        statusElement.textContent =
          error.message;

      } finally {

        askButton.disabled = false;

        questionInput.focus();
      }
    }


    questionInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          askAssistant();
        }
      }
    );
  </script>

</body>
</html>
